<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Adelanta el handshake DNS+TLS con el backend mientras el resto de la pagina
         carga, para que el primer fetch del dashboard no lo pague de cero. -->
    <link rel="preconnect" href="https://appgamonaltrasportiback-vv19.onrender.com" crossorigin />
    <meta name="description" content="Gamonal Driver: gestión de servicios, choferes, vehículos y finanzas operativas de la flota." />
    <meta name="theme-color" content="#050d1b" />
    <title>Gamonal Driver</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("gt-theme") || "dark";
          document.documentElement.classList.add(theme);
          var palette = localStorage.getItem("gt-palette");
          if (palette && palette !== "clasico") {
            document.documentElement.setAttribute("data-palette", palette);
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
